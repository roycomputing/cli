name: Check
on:
  push:
    branches: ["**"]
    # Stable tags run these same checks from release.yml.
    tags-ignore: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack --pack-destination "${{ runner.temp }}/package"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli
          path: ${{ runner.temp }}/package/*.tgz

  installed:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: cli
          path: ${{ runner.temp }}/package
      - name: Test the published executable from a clean install
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix consumer ./package/*.tgz
          ./consumer/node_modules/.bin/roy --help
          ROY_TEST_BIN="$PWD/consumer/node_modules/.bin/roy" node --test "$GITHUB_WORKSPACE"/test/*.test.mjs
