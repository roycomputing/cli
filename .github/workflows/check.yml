name: Check
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack --pack-destination "${{ runner.temp }}/package"
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: ${{ runner.temp }}/package/*.tgz

  installed:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: ${{ runner.temp }}/package
      - name: Test the published executable from a clean install
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix consumer ./package/*.tgz
          ./consumer/node_modules/.bin/roy --help
          ROY_TEST_BIN="$PWD/consumer/node_modules/.bin/roy" node --test "$GITHUB_WORKSPACE"/test/*.test.mjs
