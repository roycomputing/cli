name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/check.yml

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            target: bun-linux-x64-baseline
            asset: roy-linux-x64
          - runner: ubuntu-26.04-arm
            target: bun-linux-arm64
            asset: roy-linux-arm64
          - runner: macos-26-intel
            target: bun-darwin-x64-baseline
            asset: roy-darwin-x64
          - runner: macos-26
            target: bun-darwin-arm64
            asset: roy-darwin-arm64
          - runner: windows-2025
            target: bun-windows-x64-baseline
            asset: roy-windows-x64.exe
          - runner: windows-11-arm
            target: bun-windows-arm64
            asset: roy-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5
      - name: Build and test the standalone executable
        shell: bash
        env:
          ROY_TEST_BIN: ./${{ matrix.asset }}
          ROY_TEST_STANDALONE: "1"
        run: |
          bun build --compile --target=${{ matrix.target }} --define ROY_STANDALONE=true --no-compile-autoload-dotenv --no-compile-autoload-bunfig src/index.ts --outfile "$ROY_TEST_BIN"
          test "v$("$ROY_TEST_BIN" --version)" = "$GITHUB_REF_NAME"
          node --test test/cli.test.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish-binaries:
    needs: [build, package]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: roy-*
          path: release
          merge-multiple: true
      - name: Publish binaries
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" roy-* --verify-tag --generate-notes --latest

  publish-npm:
    needs: [build, package]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: cli
          path: ${{ runner.temp }}/package
      - name: Publish the tested tarball to npm
        working-directory: ${{ runner.temp }}/package
        run: npm publish "./roycomputing-cli-${GITHUB_REF_NAME#v}.tgz" --registry=https://registry.npmjs.org --access public --tag latest
